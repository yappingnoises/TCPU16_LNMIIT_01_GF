# Tiny Tapeout project information
project:
  title:        "TCPU16_LNMIIT_01"      # Project title
  author:       "Toshi"      # Your name
  discord:      "yappingnoises"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "An 8-bit instruction, 16-bit accumulator CPU with serial program loading" # One line description
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_yappingnoises_TCPU16"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_yappingnoises_TCPU16.v"
    - "toy_cpu16.v"
    - "ALU.v"
    - "IR.v"
    - "PC.v"
    - "prog_loader.v"
    - "prog_mem.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "PROG_DATA0"
  ui[1]: "PROG_DATA1"
  ui[2]: "PROG_DATA2"
  ui[3]: "PROG_DATA3"
  ui[4]: "PROG_DATA4"
  ui[5]: "PROG_DATA5"
  ui[6]: "PROG_DATA6"
  ui[7]: "PROG_DATA7"

  # Outputs
  uo[0]: "ACC_OUT0"
  uo[1]: "ACC_OUT1"
  uo[2]: "ACC_OUT2"
  uo[3]: "ACC_OUT3"
  uo[4]: "ACC_OUT4"
  uo[5]: "ACC_OUT5"
  uo[6]: "ACC_OUT6"
  uo[7]: "ACC_OUT7"

  # Bidirectional pins
  uio[0]: "PROG_LOAD"
  uio[1]: "RUN"
  uio[2]: "ACC_BYTE_SEL"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
